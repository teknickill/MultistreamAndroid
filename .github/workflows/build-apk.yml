# Builds a signed MultiStream APK on GitHub's servers -- no Android Studio needed.
# Runs on every push to main, or by hand: Actions tab -> Build APK -> Run workflow.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    your signing key, base64-encoded
#   KEYSTORE_PASSWORD  its password
# The APK appears under the finished run -> Artifacts -> MultiStream-apk.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME).
      # Just make sure its licenses are accepted so Gradle can fetch anything missing.
      - name: Android SDK licenses
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Add the KEYSTORE_BASE64 secret first"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > multistream-signing.keystore
          printf 'storeFile=multistream-signing.keystore\nstorePassword=%s\nkeyAlias=multistream\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties

      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk MultiStream.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MultiStream-apk
          path: MultiStream.apk

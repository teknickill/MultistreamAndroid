# Builds a signed MultiStream APK on GitHub's servers -- no Android Studio needed.
# Runs on every push to main, or by hand: Actions tab -> Build APK -> Run workflow.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    your signing key, base64-encoded
#   KEYSTORE_PASSWORD  its password
# The APK appears under the finished run -> Artifacts -> MultiStream-apk.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Works whether the project is at the top of the repo or in a subfolder
      # (e.g. android-app/): finds the folder that has settings.gradle.
      - name: Find the Android project
        run: |
          f=$(git ls-files | grep -E '(^|/)settings\.gradle(\.kts)?$' | head -1)
          if [ -z "$f" ]; then
            echo "::error::No settings.gradle in this repo. Upload the files from the android-app folder (settings.gradle, build.gradle, app/...)."
            git ls-files | head -50
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Android project folder: $dir"
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME).
      # Just make sure its licenses are accepted so Gradle can fetch anything missing.
      - name: Android SDK licenses
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Add the KEYSTORE_BASE64 secret first"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > multistream-signing.keystore
          printf 'storeFile=multistream-signing.keystore\nstorePassword=%s\nkeyAlias=multistream\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename
        working-directory: ${{ env.PROJECT_DIR }}
        run: cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/MultiStream.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MultiStream-apk
          path: MultiStream.apk
